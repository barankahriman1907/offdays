<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f2f5f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0d10" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<title>OFFDAYS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230f1720'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%233ad3a3'/%3E%3C/svg%3E">
<style>
:root{
  --display:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"DejaVu Sans Mono",monospace;

  --bg:#f2f5f3; --surface:#ffffff; --surface2:#f7f9f7; --sunken:#e9ece9;
  --ink:#10141a; --ink2:#4d5660; --muted:#858e97; --line:#e2e7e3;
  --accent:#0b8f6a; --accent-soft:#d8f0e6; --accent-ink:#064a37; --on-accent:#ffffff;
  --warn:#b26a12;
  --panel:rgba(255,255,255,.72); --panel-line:rgba(16,24,20,.07);
  --shadow:0 1px 2px rgba(16,30,25,.05),0 14px 36px -22px rgba(16,40,32,.35);
  --shadow-lg:0 2px 6px rgba(16,30,25,.06),0 30px 60px -30px rgba(16,40,32,.45);
  --r:20px; --r-sm:13px;

  --D-dot:#c2b089; --E-dot:#9a86c4; --N-dot:#3f5570; --X-dot:#22b98c;
  --atm-a:#bdf0dc; --atm-b:#e9f7f0; --atm-c:#8ee3c2;
  --hero-ink:#06301f; --hero-ink2:rgba(6,48,31,.62); --hero-line:rgba(6,48,31,.14);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0a0d10; --surface:#14181c; --surface2:#171c20; --sunken:#0f1317;
  --ink:#e9ede9; --ink2:#aab3b2; --muted:#78838a; --line:#232a2e;
  --accent:#3fc79c; --accent-soft:#0f3a2c; --accent-ink:#8ae9c5; --on-accent:#04231a;
  --warn:#e0a544;
  --panel:rgba(24,30,34,.66); --panel-line:rgba(255,255,255,.07);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 16px 40px -24px rgba(0,0,0,.95);
  --shadow-lg:0 2px 8px rgba(0,0,0,.55),0 34px 70px -34px rgba(0,0,0,1);
  --D-dot:#8d8058; --E-dot:#6e5f96; --N-dot:#405a78; --X-dot:#2bc294;
}}
:root[data-theme="dark"]{
  --bg:#0a0d10; --surface:#14181c; --surface2:#171c20; --sunken:#0f1317;
  --ink:#e9ede9; --ink2:#aab3b2; --muted:#78838a; --line:#232a2e;
  --accent:#3fc79c; --accent-soft:#0f3a2c; --accent-ink:#8ae9c5; --on-accent:#04231a;
  --warn:#e0a544;
  --panel:rgba(24,30,34,.66); --panel-line:rgba(255,255,255,.07);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 16px 40px -24px rgba(0,0,0,.95);
  --shadow-lg:0 2px 8px rgba(0,0,0,.55),0 34px 70px -34px rgba(0,0,0,1);
  --D-dot:#8d8058; --E-dot:#6e5f96; --N-dot:#405a78; --X-dot:#2bc294;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  -webkit-user-select:none;user-select:none}
button,input,select{font:inherit;color:inherit}
button{border:0;background:transparent;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* ── page wash: a faint echo of the current atmosphere ───────── */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(120% 60% at 50% 0%, var(--atm-c) 0%, transparent 62%);
  opacity:.16;transition:background .7s ease, opacity .7s ease}

.app{max-width:468px;margin:0 auto;padding:0 0 108px;position:relative;min-height:100%}
.pad{padding:0 18px}

/* ── hero ───────────────────────────────────────────────────── */
.hero{position:relative;overflow:hidden;border-radius:0 0 34px 34px;
  padding:calc(env(safe-area-inset-top) + 12px) 18px 22px;
  background:linear-gradient(168deg,var(--atm-a) 0%,var(--atm-b) 58%,var(--atm-a) 100%);
  transition:background .7s cubic-bezier(.4,0,.2,1);
  box-shadow:var(--shadow-lg)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(80% 55% at 50% 12%, var(--atm-c) 0%, transparent 70%);
  opacity:.55;transition:background .7s ease}
.hero>*{position:relative;z-index:1}

.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:2px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;
  letter-spacing:.02em;font-size:15px;color:var(--hero-ink)}
.brand svg{display:block}
.iconbtn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;
  color:var(--hero-ink);background:rgba(255,255,255,.28);border:1px solid var(--hero-line);
  transition:transform .16s ease,background .2s ease}
.iconbtn:active{transform:scale(.92)}

/* ── ring ───────────────────────────────────────────────────── */
.ringwrap{position:relative;display:grid;place-items:center;margin:6px 0 2px;touch-action:none}
.ringwrap svg{display:block;overflow:visible}
.rc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;gap:2px;padding:0 52px}
.rc .kick{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--hero-ink2);font-weight:700}
.rc .big{font-family:var(--display);font-weight:850;color:var(--hero-ink);letter-spacing:-.03em;
  font-size:38px;line-height:1.02}
.rc .big.sm{font-size:29px}
.rc .sub{font-size:11.5px;line-height:1.35;color:var(--hero-ink2);font-weight:600;margin-top:3px}
.rc .cnt{font-family:var(--display);font-size:54px;font-weight:850;line-height:1;color:var(--hero-ink);letter-spacing:-.04em}

.heroline{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
  background:rgba(255,255,255,.34);border:1px solid var(--hero-line);color:var(--hero-ink);
  font-size:12.5px;font-weight:650;transition:transform .16s ease}
.chip:active{transform:scale(.95)}
.chip.solid{background:var(--hero-ink);color:var(--atm-b);border-color:transparent}

/* ── strip ──────────────────────────────────────────────────── */
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:14px 18px 2px;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.sd{flex:0 0 auto;width:42px;border-radius:14px;padding:7px 0 6px;text-align:center;
  background:var(--surface);border:1px solid var(--line);scroll-snap-align:center;
  transition:transform .18s ease,border-color .18s ease}
.sd:active{transform:scale(.94)}
.sd .dw{font-size:9.5px;letter-spacing:.06em;color:var(--muted);font-weight:700;text-transform:uppercase}
.sd .dn{font-family:var(--display);font-size:17px;font-weight:800;line-height:1.25;letter-spacing:-.02em}
.sd .pip{width:17px;height:4px;border-radius:3px;margin:3px auto 0;background:var(--D-dot)}
.sd.on{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink)}
.sd.today .dn{color:var(--accent)}
.sd.free{background:var(--accent-soft);border-color:transparent}
.sd.free .dn{color:var(--accent-ink)}
.sd .pl{width:4px;height:4px;border-radius:50%;background:var(--warn);margin:3px auto 0}

/* ── panels ─────────────────────────────────────────────────── */
section{margin-top:26px}
.kick{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
  font-weight:700;margin:0 0 9px;padding:0 2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;box-shadow:var(--shadow)}
.panel+.panel{margin-top:10px}
.panel h3{margin:0 0 4px;font-family:var(--display);font-size:17px;font-weight:800;letter-spacing:-.02em}
.panel p{margin:0;color:var(--ink2);font-size:13.5px}
.panel .note{color:var(--muted);font-size:12.5px;margin-top:8px;line-height:1.45}
.hi{background:linear-gradient(150deg,var(--accent) 0%,var(--accent) 40%,color-mix(in srgb,var(--accent) 82%,#000) 100%);
  border-color:transparent;color:var(--on-accent)}
.hi h3,.hi p,.hi .note{color:var(--on-accent)}
.hi .note{opacity:.8}
.hi .kick2{color:rgba(255,255,255,.72)}
.kick2{font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:6px}

.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stat{font-family:var(--display);font-size:40px;font-weight:850;letter-spacing:-.04em;line-height:1}
.stat.sm{font-size:30px}
.unit{font-size:13px;font-weight:650;opacity:.85}

/* segmented */
.seg{display:inline-flex;background:var(--sunken);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:6px 14px;border-radius:9px;font-size:13px;font-weight:650;color:var(--ink2);
  transition:background .18s ease,color .18s ease}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.hi .seg{background:rgba(255,255,255,.18)}
.hi .seg button{color:rgba(255,255,255,.8)}
.hi .seg button[aria-selected="true"]{background:rgba(255,255,255,.95);color:var(--accent-ink);box-shadow:none}

/* list rows */
.lrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--line)}
.lrow:first-of-type{border-top:0}
.lrow .t{flex:1;min-width:0}
.lrow .t b{display:block;font-size:14px;font-weight:700}
.lrow .t span{display:block;font-size:12px;color:var(--muted)}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  padding:4px 9px;border-radius:999px;background:var(--sunken);color:var(--ink2);white-space:nowrap}
.tag.go{background:var(--accent-soft);color:var(--accent-ink)}
.av{width:30px;height:30px;border-radius:11px;display:grid;place-items:center;font-family:var(--display);
  font-weight:800;font-size:13px;background:var(--sunken);color:var(--ink2);flex:0 0 auto}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;
  border-radius:13px;font-size:14px;font-weight:700;background:var(--accent);color:var(--on-accent);
  transition:transform .16s ease,opacity .16s ease;width:100%}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--sunken);color:var(--ink)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn[disabled]{opacity:.4;pointer-events:none}

input[type=text],input[type=date],input[type=time],textarea,select{
  width:100%;padding:11px 13px;border-radius:13px;border:1px solid var(--line);
  background:var(--surface2);color:var(--ink);font-size:14px;appearance:none}
label.f{display:block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--muted);margin:0 0 6px 2px}
.field+.field{margin-top:11px}

/* calendar */
.calhead{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:5px}
.calhead span{text-align:center;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{position:relative;aspect-ratio:1;border-radius:11px;background:var(--surface2);
  display:grid;place-content:center;font-size:13px;font-weight:650;color:var(--ink2);
  border:1px solid transparent;transition:transform .14s ease}
.cell:active{transform:scale(.9)}
.cell.out{opacity:.32}
.cell.work{background:color-mix(in srgb,var(--D-dot) 22%,var(--surface2))}
.cell.free{background:var(--accent-soft);color:var(--accent-ink);font-weight:750}
.cell.night{background:var(--N-dot);color:#e8f1f5}
.cell.eve{background:color-mix(in srgb,var(--E-dot) 26%,var(--surface2));color:var(--ink)}
.cell.today{border-color:var(--ink)}
.cell.sel{box-shadow:0 0 0 2px var(--accent)}
.cell .dot{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:4px;height:4px;
  border-radius:50%;background:var(--warn)}
.cell .bar{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);height:3px;border-radius:2px;background:var(--accent)}

/* year map */
.year{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
.mm{text-align:left}
.mm b{display:block;font-size:11px;font-weight:750;color:var(--ink2);margin-bottom:5px;letter-spacing:.02em}
.mmg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mc{aspect-ratio:1;border-radius:3px;background:var(--sunken)}
.mc.w{background:var(--D-dot);opacity:.55}
.mc.e{background:var(--E-dot);opacity:.6}
.mc.n{background:var(--N-dot)}
.mc.f{background:var(--X-dot)}
.mc.b{background:transparent}
.mc.t{box-shadow:0 0 0 1.5px var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.legend i{display:inline-flex;align-items:center;gap:5px;font-style:normal;font-size:11px;color:var(--muted);font-weight:600}
.legend i s{width:9px;height:9px;border-radius:3px;display:block;text-decoration:none}

/* slider */
input[type=range]{width:100%;appearance:none;background:transparent;height:26px}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:var(--sunken)}
input[type=range]::-webkit-slider-thumb{appearance:none;width:24px;height:24px;border-radius:50%;
  background:var(--surface);border:2px solid var(--accent);margin-top:-9.5px;box-shadow:var(--shadow)}
.hi input[type=range]::-webkit-slider-runnable-track{background:rgba(255,255,255,.28)}
.hi input[type=range]::-webkit-slider-thumb{background:#fff;border-color:#fff}

/* window bar */
.wbar{height:8px;border-radius:5px;background:var(--sunken);overflow:hidden;display:flex;margin-top:7px}
.wbar i{display:block;height:100%}
.wbar i.l{background:var(--warn)}
.wbar i.o{background:var(--accent)}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;
  padding:7px 14px calc(env(safe-area-inset-bottom) + 8px);
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px) saturate(1.4);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line)}
.tabbar .in{max-width:468px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tabbar button{padding:7px 0 4px;border-radius:13px;color:var(--muted);display:grid;justify-items:center;gap:3px;
  font-size:10.5px;font-weight:700;letter-spacing:.01em;transition:color .2s ease}
.tabbar button svg{display:block}
.tabbar button[aria-selected="true"]{color:var(--accent)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;
  padding:calc(env(safe-area-inset-top) + 14px) 0 calc(env(safe-area-inset-bottom) + 30px);
  animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0;font-family:var(--display);font-size:24px;font-weight:850;letter-spacing:-.03em}

/* cycle editor */
.cyc{display:flex;flex-wrap:wrap;gap:5px}
.cyc button{width:38px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);
  font-family:var(--display);font-weight:800;font-size:13px;display:grid;place-content:center;gap:1px;
  transition:transform .14s ease}
.cyc button:active{transform:scale(.9)}
.cyc button small{font-size:8.5px;font-weight:700;opacity:.5;letter-spacing:.03em}
.cyc button[data-c="X"]{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
.cyc button[data-c="N"]{background:var(--N-dot);border-color:transparent;color:#e8f1f5}
.cyc button[data-c="E"]{background:color-mix(in srgb,var(--E-dot) 28%,var(--surface2))}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:13px;font-size:13.5px;font-weight:650;
  z-index:90;box-shadow:var(--shadow-lg);animation:up .24s ease}

.empty{text-align:center;color:var(--muted);font-size:13px;padding:18px 6px}
.fade{animation:fade .34s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mono{font-family:var(--mono);font-size:11.5px;letter-spacing:-.01em;word-break:break-all;
  background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink2);
  -webkit-user-select:text;user-select:text}
</style>
</head>
<body>
<div class="app">

  <!-- ══ BUGÜN ══════════════════════════════════════════════ -->
  <div id="v0">
    <div class="hero" id="hero">
      <div class="bar">
        <div class="brand"><svg id="logo" width="20" height="20" viewBox="0 0 20 20"></svg><span>OFFDAYS</span></div>
        <button class="iconbtn" id="openSet" aria-label="Ayarlar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
            <circle cx="12" cy="12" r="3.1"/><path d="M12 2.6v2.6M12 18.8v2.6M21.4 12h-2.6M5.2 12H2.6M18.6 5.4l-1.8 1.8M7.2 16.8l-1.8 1.8M18.6 18.6l-1.8-1.8M7.2 7.2 5.4 5.4"/>
          </svg>
        </button>
      </div>

      <div class="ringwrap" id="ringwrap">
        <svg id="ring" width="252" height="252" viewBox="0 0 252 252"></svg>
        <div class="rc" id="rcenter"></div>
      </div>

      <div class="heroline" id="heroline"></div>
    </div>

    <div class="strip" id="strip"></div>

    <div class="pad">
      <section id="ctxSec"></section>
      <section id="leaveSec"></section>
      <section id="sharedSec"></section>
    </div>
  </div>

  <!-- ══ TAKVİM ═════════════════════════════════════════════ -->
  <div id="v1" hidden>
    <div class="pad" style="padding-top:calc(env(safe-area-inset-top) + 16px)">
      <div class="between" style="margin-bottom:14px">
        <h2 style="margin:0;font-family:var(--display);font-size:26px;font-weight:850;letter-spacing:-.03em" id="calTitle">Takvim</h2>
        <div class="seg" id="calSeg">
          <button data-v="m" aria-selected="true">Ay</button>
          <button data-v="y" aria-selected="false">Yıl</button>
        </div>
      </div>
      <section id="monthSec" style="margin-top:0"></section>
      <section id="yearSec" style="margin-top:0" hidden></section>
      <section id="statSec"></section>
      <section id="revSec"></section>
    </div>
  </div>

  <!-- ══ EKİP ═══════════════════════════════════════════════ -->
  <div id="v2" hidden>
    <div class="pad" style="padding-top:calc(env(safe-area-inset-top) + 16px)">
      <div class="between" style="margin-bottom:14px">
        <h2 style="margin:0;font-family:var(--display);font-size:26px;font-weight:850;letter-spacing:-.03em" id="teamTitle">Ekip</h2>
        <button class="iconbtn" id="openSet2" style="background:var(--sunken);color:var(--ink);border-color:var(--line)" aria-label="Ayarlar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
            <circle cx="12" cy="12" r="3.1"/><path d="M12 2.6v2.6M12 18.8v2.6M21.4 12h-2.6M5.2 12H2.6M18.6 5.4l-1.8 1.8M7.2 16.8l-1.8 1.8M18.6 18.6l-1.8-1.8M7.2 7.2 5.4 5.4"/>
          </svg>
        </button>
      </div>
      <section id="peopleSec" style="margin-top:0"></section>
      <section id="meetSec"></section>
      <section id="swapSec"></section>
      <section id="planSec"></section>
      <section id="shareSec"></section>
    </div>
  </div>

  <nav class="tabbar"><div class="in">
    <button id="tab0" aria-selected="true">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.2"/><path d="M12 7.4V12l3 1.8"/></svg>

/* ── state ─────────────────────────────────────────────────── */
let lang="tr";
const DEFAULTS=()=>({
  me:{name:"Ben",pattern:"DDNNXXXX",anchor:iso(startOfMonth(new Date())),mon:false},
  people:[],plans:[],leave:2,notif:false,notifTime:"20:00",theme:"auto",
  hours:{D:["08:00","16:00"],E:["16:00","00:00"],N:["20:00","08:00"]}
});
const state=Object.assign({tab:0,calView:"m",month:startOfMonth(new Date()),focus:0,sel:null,swap:null},DEFAULTS());

function startOfMonth(d){return new Date(d.getFullYear(),d.getMonth(),1);}
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function fromISO(s){const[a,b,c]=String(s).split("-").map(Number);return new Date(a,b-1,c);}
function dayNum(d){return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/DAY);}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);}
function mondayIdx(d){return (d.getDay()+6)%7;}
const T=()=>STR[lang];
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());};
const fmt=d=>`${d.getDate()} ${T().months[d.getMonth()]}`;
const fmtS=d=>`${d.getDate()} ${T().mon3[d.getMonth()]}`;
const fmtLong=d=>`${T().dow[mondayIdx(d)]} · ${d.getDate()} ${T().months[d.getMonth()]}`;

function shiftFor(p,d){
  const pat=p.pattern||"X";
  const i=p.mon?mondayIdx(d)%pat.length
    :((dayNum(d)-dayNum(fromISO(p.anchor)))%pat.length+pat.length)%pat.length;
  return pat[i]||"X";
}
const all=()=>[state.me].concat(state.people);
const myShift=d=>shiftFor(state.me,d);
const isOff=d=>myShift(d)==="X";
const freeCount=d=>all().filter(p=>shiftFor(p,d)==="X").length;
const ini=n=>(n||"?").trim().charAt(0).toLocaleUpperCase(lang==="tr"?"tr":"en");
const plansOn=di=>state.plans.filter(p=>p.date===di);

const enc=o=>{try{return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/=+$/,"");}catch(e){return "";}};
const dec=s=>{try{return JSON.parse(decodeURIComponent(escape(atob(s))));}catch(e){return null;}};
const myCode=()=>"OD1."+enc({n:state.me.name,p:state.me.pattern,a:state.me.anchor,m:state.me.mon?1:0});
const planCode=pl=>"ODP."+enc({d:pl.date,t:pl.title});

const KEY="offdays";
async function save(){
  const data=JSON.stringify({me:state.me,people:state.people,plans:state.plans,lang,
    leave:state.leave,notif:state.notif,notifTime:state.notifTime,theme:state.theme,hours:state.hours});
  try{localStorage.setItem(KEY,data);}catch(e){}
  if(P.Preferences){try{await P.Preferences.set({key:KEY,value:data});}catch(e){}}
}
async function load(){
  let raw=null;
  if(P.Preferences){try{raw=(await P.Preferences.get({key:KEY})).value;}catch(e){}}
  if(!raw){try{raw=localStorage.getItem(KEY);}catch(e){}}
  if(!raw)return;
  try{const s=JSON.parse(raw);
    if(s&&s.me){Object.assign(state.me,s.me);state.people=s.people||[];state.plans=s.plans||[];
      lang=s.lang||"tr";state.leave=s.leave||2;state.notif=!!s.notif;
      state.notifTime=s.notifTime||"20:00";state.theme=s.theme||"auto";
      if(s.hours)Object.assign(state.hours,s.hours);}
  }catch(e){}
}

/* ── analysis ──────────────────────────────────────────────── */
function offRunFrom(d){let n=0,c=d;while(isOff(c)&&n<400){n++;c=addDays(c,1);}return n;}
function daysUntilOff(d){let n=0,c=d;while(!isOff(c)&&n<400){n++;c=addDays(c,1);}return n;}
function nextNightIn(from){for(let i=0;i<60;i++){const d=addDays(from,i);
  if(myShift(d)==="N"&&(i===0||myShift(addDays(from,i-1))!=="N"))return i;}return -1;}

/* longest window starting at i with at most k working days */
function winFrom(base,i,k){let w=0,j=i;
  while(j<base.length){if(base[j]!=="X"){if(w+1>k)break;w++;}j++;}
  return {i,j,len:j-i,work:w};
}
function topWindows(k,horizon,count){
  const t=today(),base=[];
  for(let i=0;i<horizon;i++)base.push(myShift(addDays(t,i)));
  const cand=[];
  for(let i=0;i<horizon;i++){
    if(base[i]==="X"&&i>0&&base[i-1]==="X")continue;
    const w=winFrom(base,i,k);
    if(w.len>=2)cand.push(w);
  }
  cand.sort((a,b)=>b.len-a.len||a.i-b.i);
  const out=[];
  for(const c of cand){
    if(out.length>=count)break;
    if(out.some(o=>c.i<o.j&&o.i<c.j))continue;
    const leave=[];
    for(let x=c.i;x<c.j;x++)if(base[x]!=="X")leave.push(addDays(t,x));
    out.push({start:addDays(t,c.i),end:addDays(t,c.j-1),len:c.len,leave});
  }
  return out;
}
/* best block containing a given date with at most k leave days */
function blockAround(target,k){
  const span=35,base=[];
  for(let i=-span;i<=span;i++)base.push(myShift(addDays(target,i)));
  const mid=span;let best=null;
  for(let i=0;i<=mid;i++){
    let w=0,ok=true;
    for(let j=i;j<base.length;j++){
      if(base[j]!=="X"){if(w+1>k){ok=false;}else w++;}
      if(!ok)break;
      if(j>=mid){const len=j-i+1;if(!best||len>best.len)best={i,j,len,work:w};}
    }
  }
  if(!best)return null;
  const leave=[];
  for(let x=best.i;x<=best.j;x++)if(base[x]!=="X")leave.push(addDays(target,x-span));
  return {start:addDays(target,best.i-span),end:addDays(target,best.j-span),len:best.len,leave};
}
function sharedDays(limit,horizon){
  const t=today(),out=[];const n=all().length;
  for(let i=0;i<horizon&&out.length<limit;i++){
    const d=addDays(t,i);
    if(freeCount(d)===n&&n>0){
      let len=1;while(len<20&&freeCount(addDays(d,len))===n)len++;
      out.push({d,len});i+=len-1;
    }
  }
  return out;
}
function freeWeekends(limit,horizon){
  const t=today(),out=[];
  for(let i=0;i<horizon&&out.length<limit;i++){
    const d=addDays(t,i);
    if(mondayIdx(d)===5&&isOff(d)&&isOff(addDays(d,1)))out.push(d);
  }
  return out;
}
function meetups(limit){
  const t=today(),n=all().length,out=[];
  for(let i=1;i<=56;i++){
    const d=addDays(t,i);
    if(freeCount(d)!==n)continue;
    let len=1;while(len<14&&freeCount(addDays(d,len))===n)len++;
    const we=mondayIdx(d)>=5;
    out.push({d,len,we,score:len*2+(we?3:0)-i*0.02});
    i+=len-1;
  }
  out.sort((a,b)=>b.score-a.score);
  return out.slice(0,limit);
}

/* ── ring ──────────────────────────────────────────────────── */
function arcPath(cx,cy,r1,r2,a0,a1){
  const rad=a=>(a-90)*Math.PI/180, pt=(r,a)=>[cx+r*Math.cos(rad(a)),cy+r*Math.sin(rad(a))];
  const [x1,y1]=pt(r2,a0),[x2,y2]=pt(r2,a1),[x3,y3]=pt(r1,a1),[x4,y4]=pt(r1,a0);
  const big=(a1-a0)>180?1:0;
  return `M${x1} ${y1}A${r2} ${r2} 0 ${big} 1 ${x2} ${y2}L${x3} ${y3}A${r1} ${r1} 0 ${big} 0 ${x4} ${y4}Z`;
}
const SEGC={D:"var(--D-dot)",E:"var(--E-dot)",N:"var(--N-dot)",X:"var(--X-dot)"};
function drawRing(){
  const pat=state.me.pattern||"X", L=pat.length, C=126, R2=106, R1=84;
  const t=today(), f=addDays(t,state.focus);
  const idx=state.me.mon?mondayIdx(f)%L
    :((dayNum(f)-dayNum(fromISO(state.me.anchor)))%L+L)%L;
  const step=360/L, gap=Math.min(1.6,step*0.09);
  let s='';
  for(let i=0;i<L;i++){
    const a0=i*step+gap/2,a1=(i+1)*step-gap/2, on=i===idx;
    s+=`<path d="${arcPath(C,C,on?R1-4:R1,on?R2+4:R2,a0,a1)}" fill="${SEGC[pat[i]]||SEGC.X}" opacity="${on?1:.72}"/>`;
  }
  /* marker */
  const ma=(idx+0.5)*step, rad=(ma-90)*Math.PI/180;
  const mx=C+(R2+16)*Math.cos(rad), my=C+(R2+16)*Math.sin(rad);
  s+=`<circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="5.2" fill="var(--hero-ink)"/>`;
  s+=`<circle cx="${C}" cy="${C}" r="${R1-9}" fill="none" stroke="var(--hero-line)" stroke-width="1"/>`;
  $("ring").innerHTML=s;
  setAtmosphere(pat[idx]);
}
function drawLogo(){
  const pat=state.me.pattern||"X",L=pat.length,step=360/L;let s='';
  for(let i=0;i<L;i++)s+=`<path d="${arcPath(10,10,6,9.4,i*step+1.5,(i+1)*step-1.5)}" fill="${SEGC[pat[i]]||SEGC.X}"/>`;
  $("logo").innerHTML=s;
}
const hm=s=>{const[a,b]=String(s||"0:0").split(":").map(Number);return (a||0)*60+(b||0);};
const durOf=c=>{const h=state.hours[c];if(!h)return 0;let d=(hm(h[1])-hm(h[0])+1440)%1440;return d||1440;};
const hoursOf=c=>c==="X"?0:durOf(c)/60;
function span(mins){const h=Math.floor(mins/60),m=mins%60;
  return (h?h+" "+T().hr+" ":"")+(m||!h?m+" "+T().mn:"").trim();}
function liveLine(c){
  if(c==="X"||!state.hours[c])return "";
  const n=new Date(),now=n.getHours()*60+n.getMinutes();
  const s=hm(state.hours[c][0]),d=durOf(c);
  let el=now-s;if(el<0)el+=0;
  if(now<s)return T().hStarts(span(s-now));
  if(now-s<d)return T().hEnds(span(d-(now-s)));
  return T().hDone;
}

function drawSwap(){

    <p class="note" style="margin:0 0 11px">${esc(T().swapHint)}</p>

        <div class="t"><b>${esc(p.name)}</b><span>${esc(T().swapFree)}</span></div>
        <span class="tag go">${esc(T().free)}</span></div>`).join("")

    h+=`</div>`;

  const s=$("swapSel");if(s)s.onchange=()=>{state.swap=s.value;tap();drawSwap();};
}
function drawPlans(){

/* ── clipboard ─────────────────────────────────────────────── */
function copy(txt){
  const done=()=>{tap();toast(T().copied);};
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(done,()=>fb(txt,done));
  else fb(txt,done);
}
function fb(txt,done){const a=document.createElement("textarea");a.value=txt;a.style.position="fixed";a.style.opacity="0";
  document.body.appendChild(a);a.select();try{document.execCommand("copy");done();}catch(e){}a.remove();}

/* ── notifications ─────────────────────────────────────────── */
let remCount=0;
async function clearReminders(){
  if(!P.LocalNotifications)return;
  try{const p=await P.LocalNotifications.getPending();
    if(p&&p.notifications&&p.notifications.length)
      await P.LocalNotifications.cancel({notifications:p.notifications});}catch(e){}
  remCount=0;
}
async function scheduleReminders(){
  if(!P.LocalNotifications||!native)return;
  try{
    const perm=await P.LocalNotifications.requestPermissions();
    if(perm&&perm.display!=="granted"){state.notif=false;await save();toast(T().remDenied);return;}
  }catch(e){}
  await clearReminders();
  const [hh,mm]=(state.notifTime||"20:00").split(":").map(Number);
  const t=today(),list=[];let id=1;
  for(let i=0;i<45;i++){
    const d=addDays(t,i),nd=addDays(d,1);
    const at=new Date(d.getFullYear(),d.getMonth(),d.getDate(),hh||20,mm||0,0);
    if(at.getTime()<Date.now()+60000)continue;
    const c=myShift(nd), body=[];
    body.push(c==="X"?T().nTomorrowOff:T().nTomorrow(c));
    if(myShift(addDays(d,2))==="N"&&myShift(addDays(d,1))!=="N")body.push(T().nNightPrep);
    const pl=plansOn(iso(nd));
    if(pl.length)body.push(T().nPlan(pl[0].title));
    list.push({id:id++,title:"OFFDAYS",body:body.join(" · "),schedule:{at}});
    if(list.length>=40)break;
  }
  if(!list.length)return;
  try{await P.LocalNotifications.schedule({notifications:list});remCount=list.length;}catch(e){}
}

/* ── navigation ────────────────────────────────────────────── */
function goTab(i){
  state.tab=i;
  [0,1,2].forEach(n=>{$("v"+n).hidden=n!==i;$("tab"+n).setAttribute("aria-selected",String(n===i));});
  if(i===0){renderToday();setAtmosphere(myShift(addDays(today(),state.focus)));}
  if(i===1){renderCal();setAtmosphere(myShift(today()));}
  if(i===2){renderTeam();setAtmosphere(myShift(today()));}
  window.scrollTo({top:0,behavior:"auto"});
  const v=$("v"+i);v.classList.remove("fade");void v.offsetWidth;v.classList.add("fade");
}
function renderAll(){
  [0,1,2].forEach(n=>$("tl"+n).textContent=T().tabs[n]);
  if(state.tab===0)renderToday();
  else if(state.tab===1)renderCal();
  else renderTeam();
}

/* ── ring scrub ────────────────────────────────────────────── */
(function(){
  const w=$("ringwrap");let last=null,acc=0;
  const ang=e=>{const r=w.getBoundingClientRect();
    const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left-r.width/2;
    const y=(e.touches?e.touches[0].clientY:e.clientY)-r.top-r.height/2;
    return Math.atan2(y,x)*180/Math.PI;};
  const start=e=>{last=ang(e);acc=0;};
  const move=e=>{
    if(last===null)return;
    const a=ang(e);let d=a-last;
    if(d>180)d-=360;if(d<-180)d+=360;
    last=a;acc+=d;
    const per=360/Math.max(1,(state.me.pattern||"X").length);
    while(Math.abs(acc)>=per){
      const s=acc>0?1:-1;acc-=s*per;
      state.focus=Math.max(-14,Math.min(180,state.focus+s));
      tap();drawRing();drawCenter();drawStrip();
    }
    e.preventDefault();
  };
  const end=()=>{last=null;};
  w.addEventListener("pointerdown",start);
  w.addEventListener("pointermove",move,{passive:false});
  w.addEventListener("pointerup",end);
  w.addEventListener("pointercancel",end);
  w.addEventListener("pointerleave",end);
})();

$("openSet").onclick=()=>{$("sheet").hidden=false;drawSettings();tap();};
$("openSet2").onclick=()=>{$("sheet").hidden=false;drawSettings();tap();};
$("tab0").onclick=()=>{tap();goTab(0);};
$("tab1").onclick=()=>{tap();goTab(1);};

if(window.matchMedia){
  const mq=window.matchMedia("(prefers-color-scheme: dark)");
  const cb=()=>{if(state.theme==="auto"){setAtmosphere(myShift(addDays(today(),state.focus)));}};
  if(mq.addEventListener)mq.addEventListener("change",cb);
}

setInterval(()=>{if(state.tab===0&&state.focus===0&&$("sheet").hidden)drawCenter();},30000);

(async function init(){
  await load();

  if(P.SplashScreen){try{await P.SplashScreen.hide();}catch(e){}}
})();
